<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Privacy Policy — Agileborne</title>
    <meta name="description" content="How Agileborne collects, uses, shares, and protects your personal information." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600&f[]=general-sans@400,500,600&display=swap" />
    <script>
      // Apply the saved/system theme before first paint to avoid a light→dark flash.
      (function () {
        var t = null;
        try { t = localStorage.getItem('agileborne-theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/entries/privacy.tsx"></script>
  </body>
</html>
